model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      litellm_credential_name: default_claude_credential
    model_info:
      cutoff: "2025-08-31"
      description: "Latest Sonnet model from Anthropic. Best for lightweight, high-speed tasks like classification, summarization, simple chat, and large-volume workflows"

  - model_name: claude-fable
    litellm_params:
      model: anthropic/claude-fable-5
      litellm_credential_name: default_claude_credential
    model_info:
      cutoff: "2026-01-31"
      description: "Anthropic's next-gen model for complex knowledge work and coding, capable of sustained autonomous operation across multi-day tasks. It plans across stages, delegates to sub-agents, and self-verifies its work"

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      litellm_credential_name: default_claude_credential
    model_info:
      cutoff: "2025-02-28"
      description: "Latest Haiku model from Anthropic. Best for balanced everyday use across coding, writing, and analysis when you want strong performance with faster turnaround"

  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-8
      litellm_credential_name: default_claude_credential
    model_info:
      cutoff: "2026-01-31"
      description: "Latest Opus model from Anthropic. Best for complex, high-stakes reasoning, deep analysis, and multi-step tasks where accuracy and nuance matter most"

credential_list:
  - credential_name: default_claude_credential
    credential_values:
      api_key: os.environ/ANTHROPIC_API_KEY
    credential_info:
      description: "Claude API key from Horde org"
      custom_llm_provider: "anthropic"
